version: 0.2
env:
  shell: bash
phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - set -euo pipefail
      - export SOURCE_SHA="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - test "${#SOURCE_SHA}" -eq 40
      - npm ci
      - npm test
      - export REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
  build:
    commands:
      - docker build --platform linux/amd64 --build-arg VIRTUSP_GIT_SHA="$SOURCE_SHA" -t "$REGISTRY/$IMAGE_REPO:$SOURCE_SHA" .
      - docker push "$REGISTRY/$IMAGE_REPO:$SOURCE_SHA"
  post_build:
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = 1
      - bash scripts/deploy-ecs.sh
