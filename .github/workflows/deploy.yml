name: Deploy AWS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: virtusp-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify GitHub identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          request = urllib.request.Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(request))['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          print('AWS OIDC subject:', claims['sub'])
          PY
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::389023343021:role/virtusp-github-deploy
          aws-region: us-west-2
      - name: Test, build, and deploy this commit to both regions
        shell: bash
        run: |
          set -euo pipefail
          build=''
          for attempt in $(seq 1 60); do
            if build=$(aws codebuild start-build --project-name virtusp-image --source-version "$GITHUB_SHA" --query 'build.id' --output text 2> /tmp/virtusp-start-error); then
              break
            fi
            cat /tmp/virtusp-start-error
            grep -q AccountLimitExceededException /tmp/virtusp-start-error || exit 1
            sleep 10
          done
          test -n "$build"
          echo "CodeBuild: $build"
          echo "Build ID: $build" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 180); do
            status=$(aws codebuild batch-get-builds --ids "$build" --query 'builds[0].buildStatus' --output text)
            case "$status" in
              SUCCEEDED) echo "Tests passed; deployed $GITHUB_SHA to us-east-1 and us-west-2" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              IN_PROGRESS) sleep 10 ;;
              *) echo "CodeBuild ended with $status"; exit 1 ;;
            esac
          done
          echo "Timed out waiting for CodeBuild"; exit 1
